info:
  name: Retorna informações de todos os NCMs
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/ncm/v1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/ncm/v1"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "codigo": "",
              "descricao": "",
              "data_inicio": "",
              "data_fim": "",
              "tipo_ato": "",
              "numero_ato": "",
              "ano_ato": ""
            }
          ]
