info:
  name: Busca as informações de um NCM a partir de um código
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/ncm/v1/:code"
  params:
    - name: code
      value: ""
      type: path
      description: "Código NCM a ser consultado. Pode conter ou não pontos de formatação (ex: 3305.10.00 ou 33051000)."
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/ncm/v1/:code"
      method: GET
      params:
        - name: code
          value: ""
          type: path
          description: "Código NCM a ser consultado. Pode conter ou não pontos de formatação (ex: 3305.10.00 ou 33051000)."
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "codigo": "3305.10.00",
            "descricao": "- Xampus",
            "data_inicio": "2022-04-01",
            "data_fim": "9999-12-31",
            "tipo_ato": "Res Camex",
            "numero_ato": "000272",
            "ano_ato": "2021"
          }
  - name: 404 Response
    description: O código do NCM não foi encontrado
    request:
      url: "{{baseUrl}}/ncm/v1/:code"
      method: GET
      params:
        - name: code
          value: ""
          type: path
          description: "Código NCM a ser consultado. Pode conter ou não pontos de formatação (ex: 3305.10.00 ou 33051000)."
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "NotFoundError",
            "message": "Código NCM não encontrado",
            "type": "NCM_CODE_NOT_FOUND"
          }
