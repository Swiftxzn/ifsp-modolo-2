info:
  name: Avalia o status de um dominio .br
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/registrobr/v1/:domain"
  params:
    - name: domain
      value: ""
      type: path
      description: O domínio ou nome a ser avaliado
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/registrobr/v1/:domain"
      method: GET
      params:
        - name: domain
          value: ""
          type: path
          description: O domínio ou nome a ser avaliado
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status_code": 2,
            "status": "REGISTERED",
            "fqdn": "brasilapi.com.br",
            "hosts": [
              "bob.ns.cloudflare.com",
              "lily.ns.cloudflare.com"
            ],
            "publication-status": "published",
            "expires-at": "2022-09-23T00:00:00-03:00",
            "suggestions": [
              "agr.br",
              "app.br",
              "art.br",
              "blog.br",
              "dev.br",
              "eco.br",
              "esp.br",
              "etc.br",
              "far.br",
              "flog.br",
              "imb.br",
              "ind.br",
              "inf.br",
              "log.br",
              "net.br",
              "ong.br",
              "rec.br",
              "seg.br",
              "srv.br",
              "tec.br",
              "tmp.br",
              "tur.br",
              "tv.br",
              "vlog.br",
              "wiki.br"
            ]
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/registrobr/v1/:domain"
      method: GET
      params:
        - name: domain
          value: ""
          type: path
          description: O domínio ou nome a ser avaliado
    response:
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "O domínio não foi informado corretamente!",
            "type": "bad_request",
            "name": "BadRequestError"
          }
