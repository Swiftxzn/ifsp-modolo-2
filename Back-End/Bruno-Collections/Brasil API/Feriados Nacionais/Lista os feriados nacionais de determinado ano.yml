info:
  name: Lista os feriados nacionais de determinado ano.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/feriados/v1/:ano"
  params:
    - name: ano
      value: ""
      type: path
      description: Ano para calcular os feriados. Deve ser um número inteiro entre 1900 e 2199.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/feriados/v1/:ano"
      method: GET
      params:
        - name: ano
          value: ""
          type: path
          description: Ano para calcular os feriados. Deve ser um número inteiro entre 1900 e 2199.
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "date": "",
              "type": "",
              "name": "",
              "fullName": ""
            }
          ]
  - name: 404 Response
    description: Ano fora do intervalo suportado.
    request:
      url: "{{baseUrl}}/feriados/v1/:ano"
      method: GET
      params:
        - name: ano
          value: ""
          type: path
          description: Ano para calcular os feriados. Deve ser um número inteiro entre 1900 e 2199.
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "BadRequestError",
            "message": "Ano fora do intervalo suportado entre 1900 e 2199.",
            "type": "feriados_range_error"
          }
  - name: 500 Response
    description: Erro interno no serviço de feriados.
    request:
      url: "{{baseUrl}}/feriados/v1/:ano"
      method: GET
      params:
        - name: ano
          value: ""
          type: path
          description: Ano para calcular os feriados. Deve ser um número inteiro entre 1900 e 2199.
    response:
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "InternalError",
            "message": "Erro ao calcular feriados.",
            "type": "feriados_error"
          }
