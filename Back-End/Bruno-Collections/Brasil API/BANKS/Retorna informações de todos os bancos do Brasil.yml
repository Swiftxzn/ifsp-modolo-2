info:
  name: Retorna informações de todos os bancos do Brasil
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/banks/v1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/banks/v1"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "ispb": "",
              "name": "",
              "code": 0,
              "fullName": ""
            }
          ]
