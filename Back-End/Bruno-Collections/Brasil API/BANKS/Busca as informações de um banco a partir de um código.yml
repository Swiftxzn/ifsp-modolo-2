info:
  name: Busca as informações de um banco a partir de um código
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/banks/v1/:code"
  params:
    - name: code
      value: ""
      type: path
      description: O código do banco<br />**Pode ser obtido <a href="#tag/BANKS/paths/~1banks~1v1/get">nesse</a> endpoint**
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/banks/v1/:code"
      method: GET
      params:
        - name: code
          value: ""
          type: path
          description: O código do banco<br />**Pode ser obtido <a href="#tag/BANKS/paths/~1banks~1v1/get">nesse</a> endpoint**
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "ispb": "00000000",
            "name": "BCO DO BRASIL S.A.",
            "code": 1,
            "fullName": "Banco do Brasil S.A."
          }
  - name: 404 Response
    description: O código do banco não foi encontrado
    request:
      url: "{{baseUrl}}/banks/v1/:code"
      method: GET
      params:
        - name: code
          value: ""
          type: path
          description: O código do banco<br />**Pode ser obtido <a href="#tag/BANKS/paths/~1banks~1v1/get">nesse</a> endpoint**
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Código bancário não encontrado",
            "type": "BANK_CODE_NOT_FOUND"
          }
