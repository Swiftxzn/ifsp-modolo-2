info:
  name: Retorna as corretoras nos arquivos da CVM.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/cvm/corretoras/v1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/cvm/corretoras/v1"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "cnpj": "",
              "nome_social": "",
              "nome_comercial": "",
              "bairro": "",
              "cep": "",
              "codigo_cvm": "",
              "complemento": "",
              "data_inicio_situacao": "",
              "data_patrimonio_liquido": "",
              "data_registro": "",
              "email": "",
              "logradouro": "",
              "municipio": "",
              "pais": "",
              "telefone": "",
              "uf": "",
              "valor_patrimonio_liquido": ""
            }
          ]
