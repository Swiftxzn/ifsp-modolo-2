info:
  name: Busca as informações de uma taxa a partir do seu nome/sigla
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/taxas/v1/:sigla"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/taxas/v1/:sigla"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "nome": "CDI",
            "valor": 7.65
          }
  - name: 404 Response
    description: Taxa ou Índice não foi encontrada
    request:
      url: "{{baseUrl}}/taxas/v1/:sigla"
      method: GET
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "NotFoundError",
            "message": "Taxa ou Índice não encontrada.",
            "type": "not_found"
          }
