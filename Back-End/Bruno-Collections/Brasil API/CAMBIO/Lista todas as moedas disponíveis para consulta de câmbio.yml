info:
  name: Lista todas as moedas disponíveis para consulta de câmbio.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/cambio/v1/moedas"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/cambio/v1/moedas"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "simbolo": "",
              "nome": "",
              "tipo_moeda": ""
            }
          ]
  - name: 500 Response
    description: Erro interno ao buscar moedas.
    request:
      url: "{{baseUrl}}/cambio/v1/moedas"
      method: GET
    response:
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "InternalError",
            "message": "Erro ao buscar moedas.",
            "type": "moedas_error"
          }
