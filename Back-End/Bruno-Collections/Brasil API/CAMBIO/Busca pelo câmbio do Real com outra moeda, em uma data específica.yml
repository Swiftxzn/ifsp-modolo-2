info:
  name: Busca pelo câmbio do Real com outra moeda, em uma data específica
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/cambio/v1/cotacao/:moeda/:data"
  params:
    - name: moeda
      value: ""
      type: path
      description: "A moeda alvo desejada (AUD, CAD, CHF, DKK, EUR, GBP, JPY, SEK, USD). Para maiores informações, consulte: /cambio/v1/moedas"
    - name: data
      value: ""
      type: path
      description: "A data desejada, o formato deve ser: YYYY-MM-DD. Os dados só estão disponíveis a partir de 28/11/1984."
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/cambio/v1/cotacao/:moeda/:data"
      method: GET
      params:
        - name: moeda
          value: ""
          type: path
          description: "A moeda alvo desejada (AUD, CAD, CHF, DKK, EUR, GBP, JPY, SEK, USD). Para maiores informações, consulte: /cambio/v1/moedas"
        - name: data
          value: ""
          type: path
          description: "A data desejada, o formato deve ser: YYYY-MM-DD. Os dados só estão disponíveis a partir de 28/11/1984."
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
