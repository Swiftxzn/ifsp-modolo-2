info:
  name: Busca por CEP com múltiplos providers e geolocalização.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/cep/v2/:cep"
  params:
    - name: cep
      value: "116005001"
      type: path
      description: "CEP a ser consultado. Deve conter exatamente 8 dígitos, com ou sem formatação (hífen). Exemplo: 01310-930 ou 01310930."
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/cep/v2/:cep"
      method: GET
      params:
        - name: cep
          value: ""
          type: path
          description: "CEP a ser consultado. Deve conter exatamente 8 dígitos, com ou sem formatação (hífen). Exemplo: 01310-930 ou 01310930."
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "cep": "89010025",
            "state": "SC",
            "city": "Blumenau",
            "neighborhood": "Centro",
            "street": "Rua Doutor Luiz de Freitas Melro",
            "location": {
              "type": "Point",
              "coordinates": {
                "longitude": "-49.0629788",
                "latitude": "-26.9244749"
              }
            }
          }
  - name: 400 Response
    description: CEP inválido ou mal formatado.
    request:
      url: "{{baseUrl}}/cep/v2/:cep"
      method: GET
      params:
        - name: cep
          value: ""
          type: path
          description: "CEP a ser consultado. Deve conter exatamente 8 dígitos, com ou sem formatação (hífen). Exemplo: 01310-930 ou 01310930."
    response:
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "BadRequestError",
            "message": "CEP deve conter exatamente 8 dígitos",
            "type": "validation_error"
          }
  - name: 404 Response
    description: CEP não encontrado em nenhum provedor.
    request:
      url: "{{baseUrl}}/cep/v2/:cep"
      method: GET
      params:
        - name: cep
          value: ""
          type: path
          description: "CEP a ser consultado. Deve conter exatamente 8 dígitos, com ou sem formatação (hífen). Exemplo: 01310-930 ou 01310930."
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "NotFoundError",
            "message": "CEP NAO ENCONTRADO",
            "type": "service_error"
          }
  - name: 500 Response
    description: Erro interno no serviço de CEP.
    request:
      url: "{{baseUrl}}/cep/v2/:cep"
      method: GET
      params:
        - name: cep
          value: ""
          type: path
          description: "CEP a ser consultado. Deve conter exatamente 8 dígitos, com ou sem formatação (hífen). Exemplo: 01310-930 ou 01310930."
    response:
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "InternalError",
            "message": "Erro interno no serviço de CEP",
            "type": "internal_error"
          }
