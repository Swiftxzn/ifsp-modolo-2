info:
  name: Retorna informações de todos estados do Brasil
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/ibge/uf/v1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/ibge/uf/v1"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 0,
              "sigla": "",
              "nome": "",
              "regiao": {
                "id": 0,
                "sigla": "",
                "nome": ""
              }
            }
          ]
