info:
  name: Busca as informações de um estado a partir da sigla ou código
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/ibge/uf/v1/:code"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/ibge/uf/v1/:code"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 35,
            "sigla": "SP",
            "nome": "São Paulo",
            "regiao": {
              "id": 3,
              "sigla": "SE",
              "nome": "Sudeste"
            }
          }
  - name: 404 Response
    description: O código / sigla do estado não foi encontrado
    request:
      url: "{{baseUrl}}/ibge/uf/v1/:code"
      method: GET
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "NotFoundError",
            "message": "UF não encontrada.",
            "type": "not_found"
          }
