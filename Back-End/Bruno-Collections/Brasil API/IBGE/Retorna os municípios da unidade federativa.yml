info:
  name: Retorna os municípios da unidade federativa
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/ibge/municipios/v1/:siglaUF?providers=dados-abertos-br,gov,wikipedia"
  params:
    - name: siglaUF
      value: ""
      type: path
      description: |
        Sigla da unidade federativa, por exemplo SP, RJ, SC, etc.
    - name: providers
      value: ""
      type: query
      description: Lista de provedores separados por vírgula.<br><strong>Provedores disponíveis:</strong> <ul><li>dados-abertos-br</li><li>gov</li><li>wikipedia</li></ul>
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

