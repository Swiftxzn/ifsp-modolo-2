info:
  name: Busca por CEP com múltiplos providers de fallback.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/cep/v1/:cep"
  params:
    - name: cep
      value: ""
      type: path
      description: |
        O CEP (Código de Endereçamento Postal) é um sistema de códigos que visa racionalizar o processo de encaminhamento e entrega de correspondências através da divisão do país em regiões postais. ... Atualmente, o CEP é composto por oito dígitos, cinco de um lado e três de outro. Cada algarismo do CEP possui um significado.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/cep/v1/:cep"
      method: GET
      params:
        - name: cep
          value: ""
          type: path
          description: |
            O CEP (Código de Endereçamento Postal) é um sistema de códigos que visa racionalizar o processo de encaminhamento e entrega de correspondências através da divisão do país em regiões postais. ... Atualmente, o CEP é composto por oito dígitos, cinco de um lado e três de outro. Cada algarismo do CEP possui um significado.
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "cep": "89010025",
            "state": "SC",
            "city": "Blumenau",
            "neighborhood": "Centro",
            "street": "Rua Doutor Luiz de Freitas Melro",
            "service": "viacep"
          }
  - name: 404 Response
    description: Todos os serviços de CEP retornaram erro.
    request:
      url: "{{baseUrl}}/cep/v1/:cep"
      method: GET
      params:
        - name: cep
          value: ""
          type: path
          description: |
            O CEP (Código de Endereçamento Postal) é um sistema de códigos que visa racionalizar o processo de encaminhamento e entrega de correspondências através da divisão do país em regiões postais. ... Atualmente, o CEP é composto por oito dígitos, cinco de um lado e três de outro. Cada algarismo do CEP possui um significado.
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "CepPromiseError",
            "message": "Todos os serviços de CEP retornaram erro.",
            "type": "service_error",
            "errors": [
              {
                "name": "ServiceError",
                "message": "CEP INVÁLIDO",
                "service": "correios"
              },
              {
                "name": "ServiceError",
                "message": "CEP não encontrado na base do ViaCEP.",
                "service": "viacep"
              }
            ]
          }
