info:
  name: Lista os veículos de acordo com a marca e o tipo de veículo
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/fipe/veiculos/v1/:tipoVeiculo/:codigoMarca"
  params:
    - name: tipoVeiculo
      value: ""
      type: path
      description: |
        Os tipos suportados são `caminhoes`, `carros` e `motos`.
    - name: codigoMarca
      value: ""
      type: path
      description: Código da marca do veiculo. Para consultar as marcas acesse a rota `/fipe/marcas/v1/`
    - name: tabela_referencia
      value: ""
      type: query
      description: |
        Código da tabela fipe de referência. Por padrão é utilizado o código da tabela fipe atual.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/fipe/veiculos/v1/:tipoVeiculo/:codigoMarca"
      method: GET
      params:
        - name: tipoVeiculo
          value: ""
          type: path
          description: |
            Os tipos suportados são `caminhoes`, `carros` e `motos`.
        - name: codigoMarca
          value: ""
          type: path
          description: Código da marca do veiculo. Para consultar as marcas acesse a rota `/fipe/marcas/v1/`
        - name: tabela_referencia
          value: ""
          type: query
          description: |
            Código da tabela fipe de referência. Por padrão é utilizado o código da tabela fipe atual.
          disabled: true
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "modelo": ""
            }
          ]
  - name: 400 Response
    description: Requisição inválida
    request:
      url: "{{baseUrl}}/fipe/veiculos/v1/:tipoVeiculo/:codigoMarca"
      method: GET
      params:
        - name: tipoVeiculo
          value: ""
          type: path
          description: |
            Os tipos suportados são `caminhoes`, `carros` e `motos`.
        - name: codigoMarca
          value: ""
          type: path
          description: Código da marca do veiculo. Para consultar as marcas acesse a rota `/fipe/marcas/v1/`
        - name: tabela_referencia
          value: ""
          type: query
          description: |
            Código da tabela fipe de referência. Por padrão é utilizado o código da tabela fipe atual.
          disabled: true
    response:
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Requisição inválida",
            "type": "bad_request",
            "name": "BadRequestError"
          }
