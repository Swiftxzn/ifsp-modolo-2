info:
  name: Consulta o preço do veículo segundo a tabela FIPE.
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/fipe/preco/v1/:codigoFipe"
  params:
    - name: codigoFipe
      value: ""
      type: path
      description: "Código FIPE do veículo que identifica unicamente um modelo específico na tabela FIPE. Exemplo: 001004-9 para Fiat Palio EX 1.0."
    - name: tabela_referencia
      value: ""
      type: query
      description: Código da tabela FIPE de referência para consulta. Se não especificado, utiliza a tabela mais atual disponível.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/fipe/preco/v1/:codigoFipe"
      method: GET
      params:
        - name: codigoFipe
          value: ""
          type: path
          description: "Código FIPE do veículo que identifica unicamente um modelo específico na tabela FIPE. Exemplo: 001004-9 para Fiat Palio EX 1.0."
        - name: tabela_referencia
          value: ""
          type: query
          description: Código da tabela FIPE de referência para consulta. Se não especificado, utiliza a tabela mais atual disponível.
          disabled: true
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "valor": "",
              "marca": "",
              "modelo": "",
              "anoModelo": 0,
              "combustivel": "",
              "codigoFipe": "",
              "mesReferencia": "",
              "tipoVeiculo": 0,
              "siglaCombustivel": "",
              "dataConsulta": ""
            }
          ]
  - name: Código Fipe Inválido
    request:
      url: "{{baseUrl}}/fipe/preco/v1/:codigoFipe"
      method: GET
      params:
        - name: codigoFipe
