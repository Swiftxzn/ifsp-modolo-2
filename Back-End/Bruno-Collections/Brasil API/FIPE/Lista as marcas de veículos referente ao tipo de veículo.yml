info:
  name: Lista as marcas de veículos referente ao tipo de veículo
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/fipe/marcas/v1/:tipoVeiculo"
  params:
    - name: tipoVeiculo
      value: ""
      type: path
      description: |
        Os tipos suportados são `caminhoes`, `carros` e `motos`. Quando o tipo não é específicado são buscada as marcas de todos os tipos de veículos
      disabled: true
    - name: tabela_referencia
      value: ""
      type: query
      description: |
        Código da tabela fipe de referência. Por padrão é utilizado o código da tabela fipe atual.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/fipe/marcas/v1/:tipoVeiculo"
      method: GET
      params:
        - name: tipoVeiculo
          value: ""
          type: path
          description: |
            Os tipos suportados são `caminhoes`, `carros` e `motos`. Quando o tipo não é específicado são buscada as marcas de todos os tipos de veículos
          disabled: true
        - name: tabela_referencia
          value: ""
          type: query
          description: |
            Código da tabela fipe de referência. Por padrão é utilizado o código da tabela fipe atual.
          disabled: true
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "nome": "",
              "valor": 0
            }
          ]
  - name: 400 Response
    description: Tabela de referência inválida
    request:
      url: "{{baseUrl}}/fipe/marcas/v1/:tipoVeiculo"
      method: GET
      params:
        - name: tipoVeiculo
          value: ""
          type: path
          description: |
            Os tipos suportados são `caminhoes`, `carros` e `motos`. Quando o tipo não é específicado são buscada as marcas de todos os tipos de veículos
          disabled: true
        - name: tabela_referencia
          value: ""
          type: query
          description: |
            Código da tabela fipe de referência. Por padrão é utilizado o código da tabela fipe atual.
          disabled: true
    response:
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Tabela de referência inválida",
            "type": "bad_request",
            "name": "BadRequestError"
          }
