info:
  name: Retorna informações de todos os participantes do PIX no dia atual ou anterior
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/pix/v1/participants"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/pix/v1/participants"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "ispb": "",
              "nome": "",
              "nome_reduzido": "",
              "modalidade_participacao": "",
              "tipo_participacao": "",
              "inicio_operacao": ""
            }
          ]
  - name: 500 Response
    description: Error
    request:
      url: "{{baseUrl}}/pix/v1/participants"
      method: GET
    response:
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Erro ao obter as informações do BCB",
            "type": "internal",
            "name": "PIX_LIST_ERROR"
          }
