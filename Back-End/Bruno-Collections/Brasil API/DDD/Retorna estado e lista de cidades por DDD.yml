info:
  name: Retorna estado e lista de cidades por DDD
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/ddd/v1/:ddd"
  params:
    - name: ddd
      value: ""
      type: path
      description: DDD significa Discagem Direta à Distância. É um código constituído por 2 dígitos que identificam as principais cidades do país. Deve ser informado apenas os 2 dígitos do código de área.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/ddd/v1/:ddd"
      method: GET
      params:
        - name: ddd
          value: ""
          type: path
          description: DDD significa Discagem Direta à Distância. É um código constituído por 2 dígitos que identificam as principais cidades do país. Deve ser informado apenas os 2 dígitos do código de área.
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "state": "SP",
            "cities": [
              "EMBU",
              "VÁRZEA PAULISTA",
              "VARGEM GRANDE PAULISTA",
              "VARGEM",
              "TUIUTI",
              "TABOÃO DA SERRA",
              "SUZANO",
              "SÃO ROQUE",
              "SÃO PAULO"
            ]
          }
  - name: 400 Response
    description: Tamanho do DDD inválido
    request:
      url: "{{baseUrl}}/ddd/v1/:ddd"
      method: GET
      params:
        - name: ddd
          value: ""
          type: path
          description: DDD significa Discagem Direta à Distância. É um código constituído por 2 dígitos que identificam as principais cidades do país. Deve ser informado apenas os 2 dígitos do código de área.
    response:
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "BadRequestError",
            "message": "DDD deve conter apenas 2 dígitos",
            "type": "DDD_INVALID"
          }
  - name: 404 Response
    description: DDD não encontrado
    request:
      url: "{{baseUrl}}/ddd/v1/:ddd"
      method: GET
      params:
        - name: ddd
          value: ""
          type: path
          description: DDD significa Discagem Direta à Distância. É um código constituído por 2 dígitos que identificam as principais cidades do país. Deve ser informado apenas os 2 dígitos do código de área.
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "NotFoundError",
            "message": "DDD não encontrado",
            "type": "DDD_NOT_FOUND"
          }
  - name: 500 Response
    description: Todos os serviços de DDD retornaram erro.
    request:
      url: "{{baseUrl}}/ddd/v1/:ddd"
      method: GET
      params:
        - name: ddd
          value: ""
          type: path
          description: DDD significa Discagem Direta à Distância. É um código constituído por 2 dígitos que identificam as principais cidades do país. Deve ser informado apenas os 2 dígitos do código de área.
    response:
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "InternalError",
            "message": "Todos os serviços de DDD retornaram erro.",
            "type": "service_error"
          }
