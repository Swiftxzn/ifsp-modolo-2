info:
  name: Buscar localidades
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/cptec/v1/cidade/:cityName"
  params:
    - name: cityName
      value: ""
      type: path
      description: Nome ou parte do nome da cidade a ser buscada
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/cptec/v1/cidade/:cityName"
      method: GET
      params:
        - name: cityName
          value: ""
          type: path
          description: Nome ou parte do nome da cidade a ser buscada
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          [
            {
              "nome": "",
              "estado": "",
              "id": 0
            }
          ]
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/cptec/v1/cidade/:cityName"
      method: GET
      params:
        - name: cityName
          value: ""
          type: path
          description: Nome ou parte do nome da cidade a ser buscada
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "NotFoundError",
            "message": "Nenhuma cidade localizada",
            "type": "NO_CITY_NOT_FOUND"
          }
