info:
  name: Previsão oceânica para, até, 6 dias
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/cptec/v1/ondas/:cityCode/:days"
  params:
    - name: cityCode
      value: ""
      type: path
      description: Código da cidade fornecido pelo endpoint /cidade
    - name: days
      value: ""
      type: path
      description: Quantidade de dias desejada para a previsão
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/cptec/v1/ondas/:cityCode/:days"
      method: GET
      params:
        - name: cityCode
          value: ""
          type: path
          description: Código da cidade fornecido pelo endpoint /cidade
        - name: days
          value: ""
          type: path
          description: Quantidade de dias desejada para a previsão
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "cidade": "Rio de Janeiro",
            "estado": "RJ",
            "atualizado_em": "2020-12-27",
            "ondas": [
              {
                "data": "27-12-2020",
                "dados_ondas": [
                  {
                    "vento": 5.2,
                    "direcao_vento": "E",
                    "direcao_vento_desc": "Leste",
                    "altura_onda": 0.8,
                    "direcao_onda": "ESE",
                    "direcao_onda_desc": "Lés-sudeste",
                    "agitacao": "Fraco",
                    "hora": "00h Z"
                  },
                  {
                    "vento": 4.8,
                    "direcao_vento": "E",
                    "direcao_vento_desc": "Leste",
                    "altura_onda": 0.5,
                    "direcao_onda": "ESE",
                    "direcao_onda_desc": "Lés-sudeste",
                    "agitacao": "Fraco",
                    "hora": "03h Z"
                  }
                ]
              }
            ]
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/cptec/v1/ondas/:cityCode/:days"
      method: GET
      params:
        - name: cityCode
          value: ""
          type: path
          description: Código da cidade fornecido pelo endpoint /cidade
        - name: days
          value: ""
          type: path
          description: Quantidade de dias desejada para a previsão
    response:
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "BadRequestError",
            "message": "Quantidade de dias inválida (mínimo 1 dia e máximo 6 dias)",
            "type": "INVALID_NUMBER_OF_DAYS"
          }
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/cptec/v1/ondas/:cityCode/:days"
      method: GET
      params:
        - name: cityCode
          value: ""
          type: path
          description: Código da cidade fornecido pelo endpoint /cidade
        - name: days
          value: ""
          type: path
          description: Quantidade de dias desejada para a previsão
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "NotFoundError",
            "message": "Cidade não localizada",
            "type": "CITY_NOT_FOUND"
          }
