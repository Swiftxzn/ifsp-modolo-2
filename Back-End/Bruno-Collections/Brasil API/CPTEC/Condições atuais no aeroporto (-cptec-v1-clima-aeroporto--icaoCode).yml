info:
  name: Condições atuais no aeroporto (/cptec/v1/clima/aeroporto/:icaoCode)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/cptec/v1/clima/aeroporto/:icaoCode"
  params:
    - name: icaoCode
      value: ""
      type: path
      description: Código ICAO (4 dígitos) do aeroporto desejado
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/cptec/v1/clima/aeroporto/:icaoCode"
      method: GET
      params:
        - name: icaoCode
          value: ""
          type: path
          description: Código ICAO (4 dígitos) do aeroporto desejado
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "codigo_icao": "SBAR",
            "atualizado_em": "2021-01-27T15:00:00.974Z",
            "pressao_atmosferica": "1014",
            "visibilidade": "9000",
            "vento": 29,
            "direcao_vento": 90,
            "umidade": 74,
            "condicao": "ps",
            "condicao_Desc": "Predomínio de Sol",
            "temp": 28
          }
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/cptec/v1/clima/aeroporto/:icaoCode"
      method: GET
      params:
        - name: icaoCode
          value: ""
          type: path
          description: Código ICAO (4 dígitos) do aeroporto desejado
    response:
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "NotFoundError",
            "message": "Condições meteorológicas ou aeroporto não localizados",
            "type": "AIRPORT_CONDITIONS_NOT_FOUND"
          }
