info:
  name: Listar localidades
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/cptec/v1/cidade"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/cptec/v1/cidade"
      method: GET
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          [
            {
              "nome": "",
              "estado": "",
              "id": 0
            }
          ]
