<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox - TailWind</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Flex Direction -->
    <!-- Linha -->
    <div class="flex flex-row bg-red-300">
      <div class="bg-red-600 p-6 m-2">1</div>
      <div class="bg-red-600 p-6 m-2">2</div>
      <div class="bg-red-600 p-6 m-2">3</div>
    </div>

    <div class="flex flex-row-reverse bg-green-300">
      <div class="bg-green-600 p-6 m-2">1</div>
      <div class="bg-green-600 p-6 m-2">2</div>
      <div class="bg-green-600 p-6 m-2">3</div>
    </div>

    <!-- Coluna -->
    <div class="flex flex-col bg-blue-300">
      <div class="bg-blue-600 p-6 m-2">1</div>
      <div class="bg-blue-600 p-6 m-2">2</div>
      <div class="bg-blue-600 p-6 m-2">3</div>
    </div>

    <div class="flex flex-col-reverse bg-yellow-300">
      <div class="bg-yellow-600 p-6 m-2">1</div>
      <div class="bg-yellow-600 p-6 m-2">2</div>
      <div class="bg-yellow-600 p-6 m-2">3</div>
    </div>

    <!-- Wrap -->
     <div class="flex flex-wrap bg-purple-300">
        <div class="bg-purple-400 p-6 m-2">1</div>
        <div class="bg-purple-500 p-6 m-2">2</div>
        <div class="bg-purple-600 p-6 m-2">3</div>
        <div class="bg-purple-700 p-6 m-2">4</div>
        <div class="bg-purple-800 p-6 m-2">5</div>
        <div class="bg-purple-900 p-6 m-2">6</div>
     </div>

     <!-- Flex Do Elemento -->
      <div class="flex container bg-pink-400 p-8">
        <div class="flex-1 bg-pink-800">1</div>
        <div class="flex-1 bg-pink-600">2</div>
        <div class="flex-none bg-pink-200 p-6">3</div>
      </div>

      <!-- Mudar a Orden -->
      <div class="flex flex-wrap bg-orange-300">
        <div class="bg-orange-400 p-6 m-2 order-last">1</div>
        <div class="bg-orange-500 p-6 m-2 order-3">2</div>
        <div class="bg-orange-600 p-6 m-2 order-2">3</div>
        <div class="bg-orange-700 p-6 m-2 order-4">4</div>
        <div class="bg-orange-800 p-6 m-2 order-5">5</div>
        <div class="bg-orange-900 p-6 m-2 order-first">6</div>
     </div>

      <div class="flex flex-wrap bg-gray-300">
        <div class="bg-gray-400 p-6 m-2 lg:order-last">1</div>
        <div class="bg-gray-500 p-6 m-2 order-3">2</div>
        <div class="bg-gray-600 p-6 m-2 order-2">3</div>
        <div class="bg-gray-700 p-6 m-2 order-4">4</div>
        <div class="bg-gray-800 p-6 m-2 order-5">5</div>
        <div class="bg-gray-900 p-6 m-2 lg:order-first">6</div>
     </div>

  </body>
</html>
