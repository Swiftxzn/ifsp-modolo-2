<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <style>
      :root {
        --font-family: "Arial", sans-serif;
        --heading-font: "Georgia", serif;
        --primary-color: #ffffff --text-color: #2d2d2d;
      }

      body {
        font-family: var(--font-family);
        color: var(--text-color);
      }

      h1,

        color: var(--primary-color);
      }
    </style>
  </head>
